# Copy to ~/.config/autophage/config.toml. The webhook secret is never set
# here: it comes from the environment (AUTOPHAGE_GITHUB_WEBHOOK_SECRET).
# Models need no key: Aperture, the gateway on the tailnet, authenticates
# the host. Values below are the built-in defaults except where noted.
listen = "127.0.0.1:8080"

[db]
url = "postgres:///autophage"

[github]
app_id          = 0                                # the GitHub App's numeric id
private_key     = "~/.config/autophage/app.pem"     # path to the App's private key PEM
bot_login       = "autophage[bot]"
operator_login  = "guy"                             # GitHub login used for operator-run approvals

# Aperture model ids, as its /v1/models lists them. The gateway is on the
# tailnet and authenticates the host, so no key is configured anywhere.

# The local Qwen on trig serves triage, auto and repair; approved runs Sonnet.
# route = "cost" or "quality" picks the model per use from the live registry
# instead (ADR 0010), and model becomes the fallback when the registry is
# unreachable or nothing is admissible: "cost" leads with the cheapest local
# model, "quality" ranks by [routing.scores] below. local_only = true limits a
# routed tier to models on local_providers; its model must then be one of the
# local models under [routing.local_context_tokens].
[model.triage]
model = "qwen-27b"

# Watch autophage_model_prompt_tokens: if auto calls near the Qwen's 131072
# window, move auto to a larger model.
[model.auto]
model = "qwen-27b"

[model.approved]
model = "anthropic/claude-sonnet-5.5"

[model.repair]
model = "qwen-27b"

[routing]
# Gateway provider ids that run on the operator's own hardware (trig).
local_providers = ["trig"]
# Context window per local model id: the registry reports none, so these
# mirror llama-swap's context_size on trig. A local model not listed here is
# never chosen.
[routing.local_context_tokens]
qwen-27b = 131072
qwen = 32768


# Push-to-deploy (ADR 0009). When repo is set and
# AUTOPHAGE_DEPLOY_WEBHOOK_SECRET is in the environment, the daemon serves
# POST /webhook/deploy: a published release from this repo is installed
# over the running binaries and the daemon restarts itself when idle.
# Empty repo disables the endpoint.
[deploy]
repo = "guygrigsby/autophage"
# install_dir = "~/.local/bin"          # default when commented out

[budget.auto]
turns      = 80
wall_clock = "90m"
diff_lines = 2000

[budget.approved]
turns      = 300
wall_clock = "6h"
diff_lines = 10000

[sandbox]
image          = "localhost/autophage-sandbox:latest"
workspaces_dir = "~/.local/share/autophage/workspaces"
concurrency    = 2

[label]
approved = "approved"

# Operator-declared quality, 0..1, per model id and task ("triage", "code" or
# "*"). A tier with route = "quality" ranks by these; an unlisted model ranks
# after every listed one. Example, commented out because scores are yours to
# declare:
# [routing.scores."anthropic/claude-sonnet-5"]
# code = 0.9
# [routing.scores.qwen-27b]
# code = 0.5
