# Copy to ~/.config/autophage/config.toml. The webhook secret is never set
# here: it comes from the environment (AUTOPHAGE_GITHUB_WEBHOOK_SECRET).
# Models need no key: Aperture, the gateway on the tailnet, authenticates
# the host. Values below are the built-in defaults except where noted.
listen = "127.0.0.1:8080"

[db]
url = "postgres:///autophage"

[github]
app_id          = 0                                # the GitHub App's numeric id
private_key     = "~/.config/autophage/app.pem"     # path to the App's private key PEM
bot_login       = "autophage[bot]"
operator_login  = "guy"                             # GitHub login used for operator-run approvals

# Aperture model ids, as its /v1/models lists them. The gateway is on the
# tailnet and authenticates the host, so no key is configured anywhere.

# route = "cost" picks the model per use from the live registry (ADR 0010):
# models on local_providers are free and lead, then the cheapest priced
# model the gateway serves. The configured id is the fallback when the
# registry is unreachable or nothing is admissible. Leave route empty to run
# the configured id as is; "performance" is for tiers once the snapshot
# carries quality signals.
[model.triage]
model = "zai/glm-5.3"
route = "cost"

[model.auto]
model = "anthropic/claude-sonnet-5"

[model.approved]
model = "anthropic/claude-sonnet-5"

# Upkeep repair rounds; the free route on the local Qwens.
[model.repair]
model = "qwen-27b"
route = "cost"

[routing]
# Gateway provider ids that run on the operator's own hardware (trig).
local_providers = ["trig"]
# trig's context window, in tokens: the registry reports none for local
# models, and one without a known window is never chosen. Set it to the
# --ctx-size trig serves. Defaults to 0 (unknown) when commented out.
# local_context_tokens = 131072
# An agent-select snapshot artifact adopted at boot; empty routes unscored.
# snapshot = "~/.local/share/autophage/routing-snapshot.json"

# Push-to-deploy (ADR 0009). When repo is set and
# AUTOPHAGE_DEPLOY_WEBHOOK_SECRET is in the environment, the daemon serves
# POST /webhook/deploy: a published release from this repo is installed
# over the running binaries and the daemon restarts itself when idle.
# Empty repo disables the endpoint.
[deploy]
repo = "guygrigsby/autophage"
# install_dir = "~/.local/bin"          # default when commented out

[budget.auto]
turns      = 80
wall_clock = "90m"
diff_lines = 2000

[budget.approved]
turns      = 300
wall_clock = "6h"
diff_lines = 10000

[sandbox]
image          = "localhost/autophage-sandbox:latest"
workspaces_dir = "~/.local/share/autophage/workspaces"
concurrency    = 2

[label]
approved = "approved"
